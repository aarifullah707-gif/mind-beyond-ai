<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIND BEYOND</title>
<style>
body{background:#0b1220;color:white;font-family:Arial,sans-serif;padding:25px;max-width:650px;margin:auto}
h1{text-align:center;color:#73e0c1}
textarea{width:100%;height:150px;box-sizing:border-box;background:#152238;color:white;padding:15px;border-radius:12px;font-size:17px}
button{width:100%;padding:16px;margin-top:15px;background:#73e0c1;border:0;border-radius:12px;font-size:17px;cursor:pointer}
button:disabled{opacity:.6}
#status{color:#73e0c1}
#answer{white-space:pre-wrap;line-height:1.9;margin-top:20px;background:#152238;padding:15px;border-radius:12px;min-height:30px;overflow-wrap:anywhere}
#sources{margin-top:18px;line-height:2}
#sources a{color:#73e0c1;display:block;direction:ltr;text-align:left;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>✧ MIND BEYOND</h1>
<p>له ستونزې تر روښانه حل پورې</p>
<textarea id="prompt" placeholder="خپله پوښتنه ولیکئ"></textarea>
<button id="send">تحلیل پیل کړه</button>
<p id="status"></p>
<div id="answer"></div>
<div id="sources"></div>
<script>
const send=document.getElementById("send");
send.onclick=async()=>{
  const p=document.getElementById("prompt").value.trim();
  const status=document.getElementById("status");
  const answerBox=document.getElementById("answer");
  const sourcesBox=document.getElementById("sources");
  if(!p){status.textContent="پوښتنه ولیکئ";return;}
  send.disabled=true;
  status.textContent="څېړنه روانه ده...";
  answerBox.textContent="";
  sourcesBox.replaceChildren();
  try{
    const response=await fetch("https://mind-beyond-ai.aarifullah707.workers.dev/",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:p})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"د ځواب ترلاسه کولو کې ستونزه");
    const answer=typeof data.answer==="string"?data.answer:
      (data.answer?JSON.stringify(data.answer,null,2):"ځواب تش راغی. بیا هڅه وکړئ.");
    answerBox.textContent=answer;
    if(Array.isArray(data.sources)&&data.sources.length){
      const heading=document.createElement("h3");
      heading.textContent="سرچینې";
      sourcesBox.appendChild(heading);
      data.sources.forEach((source,index)=>{
        if(!source.url) return;
        const link=document.createElement("a");
        link.href=source.url;
        link.target="_blank";
        link.rel="noopener noreferrer";
        link.textContent=(index+1)+". "+(source.title||source.url);
        sourcesBox.appendChild(link);
      });
    }
    status.textContent="ځواب چمتو شو";
  }catch(error){
    status.textContent="تېروتنه: "+error.message;
  }finally{
    send.disabled=false;
  }
};
</script>
</body>
</html>
