<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIND BEYOND</title>
<style>
body{background:#0b1220;color:white;font-family:Arial,sans-serif;padding:25px;max-width:650px;margin:auto}
h1{text-align:center;color:#73e0c1}
textarea{width:100%;height:150px;box-sizing:border-box;background:#152238;color:white;padding:15px;border-radius:12px;font-size:17px}
button{width:100%;padding:16px;margin-top:15px;background:#73e0c1;border:0;border-radius:12px;font-size:17px}
#answer{white-space:pre-wrap;line-height:1.8;margin-top:20px}
</style>
</head>
<body>
<h1>✧ MIND BEYOND</h1>
<p>له ستونزې تر روښانه حل پورې</p>
<textarea id="prompt" placeholder="خپله پوښتنه ولیکئ"></textarea>
<button id="send">تحلیل پیل کړه</button>
<p id="status"></p>
<div id="answer"></div>
<script>
document.getElementById("send").onclick=async()=>{
const p=document.getElementById("prompt").value.trim();
const s=document.getElementById("status");
const a=document.getElementById("answer");
if(!p){s.textContent="پوښتنه ولیکئ";return;}
s.textContent="څېړنه روانه ده...";
try{
const r=await fetch("https://mind-beyond-ai.aarifullah707.workers.dev/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({prompt:p})
});
const d=await r.json();
if(!r.ok)throw Error(d.error||"Error");
a.textContent=typeof d.answer==="string"?d.answer:JSON.stringify(d.answer??d,null,2);
s.textContent="ځواب چمتو شو";
}catch(e){s.textContent="تېروتنه: "+e.message;}
};
</script>
</body>
</html>
